name: Trigger auto deployment for demo-suhi-containerapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/demo-suhi-containerapp-AutoDeployTrigger-bf13009d-a107-4ecc-a7a2-b5426336f39b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEMOSUHICONTAINERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEMOSUHICONTAINERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEMOSUHICONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.DEMOSUHICONTAINERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEMOSUHICONTAINERAPP_REGISTRY_PASSWORD }}
          containerAppName: demo-suhi-containerapp
          resourceGroup: Suhi-Container-App-demo
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


